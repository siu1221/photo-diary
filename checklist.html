<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루 한 장 체크리스트</title>
<style>
  :root { --bg: #fff8f4; --card: #fff; --ink: #4b3b40; --soft: #a8959b; --line: #f3e5e1; --acc: #f06d90; --ok: #3fae8a; --ng: #e05a6f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1b20; --card: #2a2730; --ink: #ece6ea; --soft: #9b929a; --line: #3b3640; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding: 16px 16px 60px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.3rem; color: var(--acc); margin: 8px 0 4px; }
  .sub { color: var(--soft); font-size: .85rem; margin: 0 0 16px; }
  .bar { position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 1; }
  .gauge { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .gauge i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .3s; }
  .count { font-size: .85rem; margin-top: 6px; display: flex; justify-content: space-between; }
  h2 { font-size: 1rem; margin: 22px 0 8px; }
  .item { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; box-shadow: 0 2px 8px #0000000a; }
  .item p { margin: 0 0 8px; line-height: 1.5; font-size: .95rem; }
  .item b { color: var(--acc); }
  .btns { display: flex; gap: 6px; }
  .btns button { flex: 1; padding: 8px 0; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-size: .9rem; }
  .item[data-v="ok"] .ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .item[data-v="ng"] .ng { background: var(--ng); border-color: var(--ng); color: #fff; }
  .item[data-v="ok"] p { color: var(--soft); }
  textarea { display: none; width: 100%; margin-top: 8px; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; font: inherit; font-size: 16px; background: var(--card); color: var(--ink); }
  .item[data-v="ng"] textarea { display: block; }
  .copy { width: 100%; margin-top: 20px; padding: 14px; border-radius: 14px; border: 0; background: var(--acc); color: #fff; font-size: 1rem; }
  .hint { color: var(--soft); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>📋 하루 한 장 체크리스트</h1>
  <p class="sub">아이폰에서 하나씩 해 보고 ✅ / ❌를 눌러요. ❌면 무엇이 이상했는지 적어 두세요. (이 폰에 자동 저장돼요)</p>
  <div class="bar"><div class="gauge"><i id="g"></i></div><div class="count"><span id="c"></span><span id="n"></span></div></div>
  <div id="list"></div>
  <button class="copy" id="copy">❌ 항목만 복사하기 (Claude에게 붙여넣기)</button>
  <p class="hint">시작 전에: 앱을 완전히 껐다 켜서 최신 버전으로 만들어 주세요.</p>
</main>
<script>
const GROUPS = [
  ['🔊 소리', [
    '노래를 틀고(<b>Apple·유튜브 각각</b>) 🎙 녹음 → 들어 보기: 목소리 크기가 괜찮은지',
    '녹음을 등록한 뒤 노래가 <b>원래 크기로</b> 이어지는지',
    'Apple 노래 <b>볼륨 막대</b>를 움직이면 소리가 바뀌는지',
    '유튜브 <b>구간부터</b> → 분·초 입력 / <b>🎯 지금 듣는 곳으로</b> → 저장 → 다시 열면 그 위치부터 나오는지',
    '다 쓴 일기를 열면 노래가 <b>자동으로</b> 나오는지 (유튜브는 ▶를 눌러야 할 수 있음)',
    '노래 틀고 <b>홈 화면으로 나가면 멈추고</b>, 돌아오면 이어지는지',
  ]],
  ['🖼 사진·영상', [
    '사진 여러 장을 고르면 편집 창 하나에서 <b>번호 사진</b>으로 오가며 편집하고, ✓ 한 번에 등록되는지',
    '번호 사진을 <b>꾹 눌러 끌면</b> 순서가 바뀌는지',
    '보정 <b>%</b>가 보이는지, 다시 편집하면 <b>지난 값이 그대로</b>인지',
    '사진과 영상을 섞어 고르면 <b>고른 순서대로</b> 올라가는지',
    '세로로 긴 영상이 <b>잘리지 않는지</b>',
  ]],
  ['💾 저장 (제일 중요)', [
    '사진·영상 올리고 저장 → <b>앱 완전히 껐다 켜기</b> → <b>색 테마 바꾸기</b> → 사진이 그대로 있는지',
    '⋯ 설정 → <b>백업 파일 만들기</b>가 되는지 (파일 앱에 저장되는지)',
  ]],
  ['✨ 기타', [
    '노래 고르는 창의 <b>▶ 유튜브에서 찾기</b>로 갔다 돌아왔을 때 화면이 멀쩡한지',
    '달력 칸이 충분히 크고 <b>사진이 잘 보이는지</b>',
  ]],
];
const KEY = 'pd-checklist-v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} draw(); };
const plain = h => h.replace(/<[^>]+>/g, '');
let n = 0;
const list = document.getElementById('list');
for (const [title, items] of GROUPS) {
  const h = document.createElement('h2'); h.textContent = title; list.append(h);
  for (const text of items) {
    const id = ++n, s = state[id] || {};
    const box = document.createElement('div');
    box.className = 'item'; box.dataset.v = s.v || '';
    box.innerHTML = `<p>${id}. ${text}</p><div class="btns"><button class="ok">✅ 잘 돼요</button><button class="ng">❌ 이상해요</button></div><textarea rows="2" placeholder="어떻게 이상했는지 적어 주세요"></textarea>`;
    const ta = box.querySelector('textarea'); ta.value = s.note || '';
    const set = v => { state[id] = { ...state[id], v: state[id]?.v === v ? '' : v }; box.dataset.v = state[id].v; save(); };
    box.querySelector('.ok').onclick = () => set('ok');
    box.querySelector('.ng').onclick = () => set('ng');
    ta.oninput = () => { state[id] = { ...state[id], note: ta.value }; save(); };
    box.dataset.text = plain(text);
    list.append(box);
  }
}
function draw() {
  const vals = Object.values(state).map(s => s.v).filter(Boolean);
  const okN = vals.filter(v => v === 'ok').length, ngN = vals.filter(v => v === 'ng').length;
  document.getElementById('g').style.width = (vals.length / n * 100) + '%';
  document.getElementById('c').textContent = `${vals.length} / ${n} 확인`;
  document.getElementById('n').textContent = `✅ ${okN}  ❌ ${ngN}`;
}
document.getElementById('copy').onclick = async () => {
  const bad = [...document.querySelectorAll('.item[data-v="ng"]')].map(b => `- ${b.querySelector('p').textContent}${b.querySelector('textarea').value ? `\n  → ${b.querySelector('textarea').value}` : ''}`);
  const text = bad.length ? '체크리스트에서 안 된 것:\n' + bad.join('\n') : '체크리스트 전부 잘 돼요!';
  try { await navigator.clipboard.writeText(text); alert('복사했어요. Claude에게 붙여넣어 주세요.'); } catch { prompt('아래 내용을 복사해 주세요', text); }
};
draw();
</script>
</body>
</html>
